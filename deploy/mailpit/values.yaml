# Mailpit — SMTP testing tool for development
# Deployed to helpnow namespace alongside postgres
#
# Web UI: http://<external-ip>:8025
# SMTP:   <external-ip>:1025

replicaCount: 1

mailpit:
  ui:
    authFile:
      enabled: false
    tls:
      enabled: false
  smtp:
    authFile:
      enabled: false
    tls:
      enabled: false

service:
  http:
    type: LoadBalancer
    port: 8025
  smtp:
    type: LoadBalancer
    port: 1025

persistence:
  enabled: false

resourcesPreset: nano
