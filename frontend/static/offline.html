<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Batchrite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', system-ui, sans-serif;
            background: #F4F7F9;
            color: #122231;
            padding: 2rem;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
        }
        .icon svg { display: block; width: 100%; height: 100%; }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        p {
            color: #3a4a5c;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        button {
            padding: 0.625rem 1.5rem;
            background: #0A4C5C;
            color: #F4F7F9;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                    <clipPath id="brm-offline">
                        <path d="M 41 14 L 59 14 L 59 38 A 24 24 0 1 1 41 38 Z"/>
                    </clipPath>
                </defs>
                <g clip-path="url(#brm-offline)">
                    <path d="M 41 14 L 59 14 L 59 38 A 24 24 0 1 1 41 38 Z" fill="#1DA570"/>
                    <circle cx="50" cy="62" r="6" fill="#F4F7F9"/>
                </g>
                <path d="M 41 14 L 59 14 L 59 38 A 24 24 0 1 1 41 38 Z"
                      fill="none" stroke="#0A4C5C" stroke-width="6" stroke-linejoin="round"/>
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>This page isn't available offline. Check your connection and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
